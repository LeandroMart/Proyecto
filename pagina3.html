<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio src="assets/sounds/GLaDOS_encount.wav" type="audio/wav"></audio>
    <header>
        <a href="index.html">
         <img src="assets/img/ce9db53e56bc2f5534e7c3f69aa8a482.jpg" alt="aperture logo" class="logo">
         </a>
        <h1>APERTURE SCIENCE</h1>
    </header>
  
<section class="formulario-aperture">
    <div class="form-header">
        <span>APERTURE SCIENCE</span>
        <h2>REGISTRO DE PERSONAL</h2>
        <p>Ingrese los datos solicitados para continuar con el procedimiento.</p>
    </div>

    <form action="#" method="post">

        <div class="campo">
            <label for="nombre">NOMBRE COMPLETO</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre" required>
        </div>

        <div class="campo">
            <label for="email">CORREO ELECTRÓNICO</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@aperture.test" required>
        </div>

        <div class="campo">
            <label for="edad">EDAD</label>
            <input type="number" id="edad" name="edad" min="1" max="120">
        </div>

        <div class="campo">
            <label for="sector">SECTOR ASIGNADO</label>
            <select id="sector" name="sector">
                <option value="">-- Seleccione un sector --</option>
                <option value="testing">Testing</option>
                <option value="laboratorio">Laboratorio</option>
                <option value="ingenieria">Ingeniería</option>
                <option value="mantenimiento">Mantenimiento</option>
            </select>
        </div>

        <div class="campo">
            <label for="mensaje">INFORMACIÓN ADICIONAL</label>
            <textarea id="mensaje" name="mensaje" rows="5"
                placeholder="Ingrese información adicional..."></textarea>
        </div>

        <div class="checkbox">
            <input type="checkbox" id="acepto" name="acepto" required>
            <label for="acepto">
                Confirmo que la información proporcionada es correcta.
            </label>
        </div>

        <button type="submit">INICIAR PROCEDIMIENTO</button>

    </form>

    <div class="form-footer">
        APERTURE SCIENCE COMPUTER-AIDED ENRICHMENT CENTER
    </div>
</section>









</body>
<footer>
    <p>© 2026 Aperture Science Laboratories</p>
    <p>We do what we must because we can.</p>
</footer>
</html>
